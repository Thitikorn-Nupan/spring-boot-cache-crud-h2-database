spring.application.name=understand-spring-boot-cache-crud-h2-database
spring.main.banner-mode=off
logging.level.root[0]=info
logging.level.root[1]=debug
base-rest-prefix=/api
spring.config.import=classpath:info/configs.properties
spring.datasource.url=${H2_URL_INDISK}/db/rmutp_university
spring.datasource.username=${H2_USERNAME}
spring.datasource.password=${H2_PASSWORD}
spring.jpa.database-platform=${H2_JPA_PLATFORM}
spring.jpa.show-sql=true
spring.h2.console.enabled=true
# example put url on ui at below path jdbc:h2:file:B:/h2-database/db/rmutp_university
spring.h2.console.path=/h2-ui